services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d databse"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.0-management-alpine
    container_name: rabbitmq_broker
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: spring_app
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      DATABASE_USERNAME: ${DB_USER}
      DATABASE_PASSWORD: ${DB_PASSWORD}
      RABBIT_HOST: ${RABBIT_HOST}
      RABBIT_PORT: ${RABBIT_PORT}
      RABBIT_USERNAME: ${RABBIT_USER}
      RABBIT_PASSWORD: ${RABBIT_PASS}
      SALT: ${MY_SALT}
      APP_SCHEDULER_INTERVAL: ${APP_SCHEDULER_INTERVAL}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notification_worker:
    build: ./notification_worker
    container_name: notification_worker
    volumes:
      - ./logs:/app/logs
    environment:
      RABBIT_HOST: rabbitmq
      RABBIT_PORT: 5672
      RABBIT_USERNAME: ${RABBIT_USER}
      RABBIT_PASSWORD: ${RABBIT_PASS}
      RABBIT_QUEUE: notification_queue
      VK_API_METHOD: messages.send
      VK_GROUP_TOKEN: ${VK_GROUP_TOKEN}
      VK_SERVICE_TOKEN: ${VK_SERVICE_TOKEN}
      LOG_FILE: /app/logs/notification_worker.log
    depends_on:
      rabbitmq:
        condition: service_healthy
